# =============================================================================
# 📦 Build Android Bundle (AAB) — React Native (Expo prebuild + Gradle)
# =============================================================================
#
# Genera el AAB firmado de producción para Google Play.
#
#   npm ci → amplify pull → expo prebuild → ./gradlew bundleRelease → (deploy)
#
# No se usa EAS Build ni EAS Submit: todo se compila y firma con Gradle en el
# runner, y la subida a Play se hace con `r0adkll/upload-google-play`.
#
# 📁 APP_DIR
#   Todo es relativo a `${{ env.APP_DIR }}`. Desde el cutover del 2026-09-11 la
#   app RN vive en la raíz del repo (`APP_DIR: .`); se conserva la
#   parametrización por si vuelve a moverse a un subdirectorio.
#
# 🔐 Secrets obligatorios
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  — amplify pull
#   ANDROID_KEYSTORE_BASE64                    — keystore de upload en base64:
#         base64 -i keystore.jks | pbcopy      (macOS)
#         base64 -w0 keystore.jks              (Linux)
#     Fallback de transición: si el secret no existe pero `android/keys/keystore.jks`
#     sigue versionado, se usa ese archivo. En cuanto el keystore se purgue de
#     la historia del repo, el secret pasa a ser obligatorio de verdad.
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD — credenciales del keystore
#
# 🔐 Secrets opcionales
#   PLAY_SERVICE_ACCOUNT_JSON  — ver el job `deploy-play` más abajo
#   SLACK_WEBHOOK_URL          — notificaciones
#
# ⚙️ Variables de repositorio (Settings → Secrets and variables → Actions → Variables)
#   PLAY_DEPLOY_ENABLED = 'true'  → activa la subida automática a Play
# =============================================================================

name: 📦 Build Android Bundle (AAB) - Production Signed

# Los builds de producción no se cancelan entre sí (cada uno puede acabar en
# Play); solo se serializan por rama para no competir por Maven Central.
concurrency:
  group: build-aab-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de Amplify'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - test
          - develop
      version_name:
        description: 'Version Name (ej: 2.3.0). Vacío = el de app.json'
        required: false
        type: string
      version_code:
        description: 'Version Code (entero > 178830096). Vacío = automático por timestamp'
        required: false
        type: string

  release:
    types: [published]

  push:
    tags:
      - 'V*.*.*'
      - 'v*.*.*'
    branches:
      - main

env:
  # 👇 La app RN vive en la raíz del repo desde el cutover del 2026-09-11.
  APP_DIR: .
  AMPLIFY_APP_ID: d2l8hh51bqhq16
  AMPLIFY_PROJECT_NAME: UVA
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  AWS_REGION: us-east-1
  # versionCode ya publicado en Google Play (ficha nueva). Todo build debe
  # generar un versionCode estrictamente mayor o Play rechaza el AAB.
  MIN_ANDROID_VERSION_CODE: 178830096
  ANDROID_PACKAGE_NAME: com.makesens.appuva

jobs:
  build:
    name: 📦 Build AAB
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      environment: ${{ steps.auto-env.outputs.environment }}

    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🎯 Determine environment
        id: auto-env
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "release" ] || [ "${{ github.ref }}" == "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "environment=main" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/test" ]; then
            echo "environment=test" >> $GITHUB_OUTPUT
          else
            echo "environment=develop" >> $GITHUB_OUTPUT
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.APP_DIR), format('{0}/app.json', env.APP_DIR)) }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 🏷️ Generate version information
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail

          # --- versionName ---------------------------------------------------
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION_NAME="${{ github.event.release.tag_name }}"
            SOURCE=release
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_NAME="${{ github.ref_name }}"
            SOURCE=tag
          elif [ -n "${INPUT_VERSION_NAME:-}" ]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
            SOURCE=manual
          else
            VERSION_NAME=$(node -p "require('./$APP_DIR/app.json').expo.version")
            SOURCE=app.json
          fi
          VERSION_NAME=${VERSION_NAME#v}
          VERSION_NAME=${VERSION_NAME#V}

          # --- versionCode ---------------------------------------------------
          # Misma estrategia que el pipeline de Ionic: timestamp reducido.
          # `date +%s / 10` → un código nuevo cada 10 s, siempre creciente y
          # muy por debajo del techo de Android (2147483647). Hoy ronda
          # 1789xxxxx, ya por encima del 178830096 publicado en Play.
          if [ -n "${INPUT_VERSION_CODE:-}" ]; then
            VERSION_CODE="$INPUT_VERSION_CODE"
          else
            TIMESTAMP=$(date +%s)
            VERSION_CODE=$(( TIMESTAMP / 10 ))
            if [ "$VERSION_CODE" -gt 2147483647 ]; then
              VERSION_CODE=$(( TIMESTAMP / 100 ))
            fi
          fi

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "❌ versionCode '$VERSION_CODE' no es un entero"
            exit 1
          fi
          if [ "$VERSION_CODE" -le "$MIN_ANDROID_VERSION_CODE" ]; then
            echo "❌ versionCode $VERSION_CODE <= $MIN_ANDROID_VERSION_CODE (ya publicado en Play)."
            echo "ℹ️  Google Play sólo acepta versionCode estrictamente crecientes."
            exit 1
          fi

          # Consumidos por app.config.js, que sobreescribe app.json en prebuild.
          echo "EXPO_ANDROID_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "EXPO_APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "artifact_name=android-bundle-v$VERSION_NAME-$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ versionName=$VERSION_NAME ($SOURCE) versionCode=$VERSION_CODE"

      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📦 Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: ⚡ Pull Amplify backend
        env:
          AMPLIFY_CLI_DISABLE_BROWSER_AUTH: true
          AMPLIFY_ENV: ${{ steps.auto-env.outputs.environment }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          echo "🎯 Environment: $AMPLIFY_ENV"
          npm install -g @aws-amplify/cli@latest

          # `amplify pull` corre en la raíz del repo (donde vive `amplify/`).
          # Frontend javascript + framework react-native: sin BuildCommand de
          # Angular ni DistributionDir `www`; el bundle JS lo produce Metro
          # dentro de la tarea de Gradle.
          AMPLIFY_JSON="{\"projectName\":\"$AMPLIFY_PROJECT_NAME\",\"appId\":\"$AMPLIFY_APP_ID\",\"envName\":\"$AMPLIFY_ENV\"}"
          PROVIDERS_JSON="{\"awscloudformation\":{\"configLevel\":\"project\",\"useProfile\":false,\"accessKeyId\":\"$AWS_ACCESS_KEY_ID\",\"secretAccessKey\":\"$AWS_SECRET_ACCESS_KEY\",\"region\":\"$AWS_REGION\"}}"
          FRONTEND_JSON="{\"frontend\":\"javascript\",\"framework\":\"react-native\",\"config\":{\"SourceDir\":\"src\",\"DistributionDir\":\"/\",\"BuildCommand\":\"npm run-script build\",\"StartCommand\":\"npm run-script start\"}}"

          amplify pull \
            --amplify "$AMPLIFY_JSON" \
            --providers "$PROVIDERS_JSON" \
            --frontend "$FRONTEND_JSON" \
            --yes

          echo "✅ Amplify backend configurado"

      - name: 📄 Place amplifyconfiguration.json
        run: |
          set -euo pipefail
          # `src/data/amplify-bootstrap/amplify-config.ts` hace
          #   require('../../../amplifyconfiguration.json')
          # → el archivo debe quedar en la RAÍZ de la app RN ($APP_DIR).
          # Metro lo empaqueta al compilar, así que va antes de Gradle.
          TARGET="$APP_DIR/amplifyconfiguration.json"
          # Con APP_DIR=. (app en la raíz) amplify pull ya lo deja en su sitio;
          # el find solo es el fallback para un layout con subdirectorio.
          if [ -f "$TARGET" ]; then
            FOUND="$TARGET"
          else
            FOUND=$(find . -maxdepth 3 -name 'amplifyconfiguration.json' \
              -not -path './node_modules/*' -not -path './amplify/*' | head -n 1)
          fi

          if [ -z "$FOUND" ]; then
            echo "❌ amplify pull no generó amplifyconfiguration.json"
            exit 1
          fi
          echo "📍 Encontrado en: $FOUND"

          if [ "$(realpath "$FOUND")" != "$(realpath -m "$TARGET")" ]; then
            cp "$FOUND" "$TARGET"
          fi

          node -e "const c=require('./$TARGET'); if(!c.aws_appsync_graphqlEndpoint){throw new Error('amplifyconfiguration.json sin aws_appsync_graphqlEndpoint')}; console.log('✅ Endpoint:', c.aws_appsync_graphqlEndpoint)"

      - name: 🔐 Prepare production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_TMP="$RUNNER_TEMP/release.keystore"

          # Fuente principal: secret base64 (el keystore ya no se versiona).
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_TMP"
            echo "🔑 Keystore desde el secret ANDROID_KEYSTORE_BASE64"
          elif [ -f "android/keys/keystore.jks" ]; then
            # Fallback de transición mientras el keystore siga en el repo.
            cp android/keys/keystore.jks "$KEYSTORE_TMP"
            echo "🔑 Keystore desde android/keys/keystore.jks (fallback de transición)"
            echo "⚠️  Migra a ANDROID_KEYSTORE_BASE64: el keystore se purgará de la historia."
          else
            echo "❌ No hay keystore de producción."
            echo "ℹ️  Settings → Secrets and variables → Actions → New repository secret"
            echo "ℹ️  Nombre: ANDROID_KEYSTORE_BASE64"
            echo "ℹ️  Valor:  base64 -w0 keystore.jks   (macOS: base64 -i keystore.jks)"
            exit 1
          fi

          for required in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "❌ Falta el secret $required"
              exit 1
            fi
          done

          # Validar que el keystore abre con esas credenciales antes de gastar
          # 10 minutos de Gradle para fallar al final.
          if ! keytool -list -keystore "$KEYSTORE_TMP" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "❌ No se puede abrir el keystore con KEYSTORE_PASSWORD / KEY_ALIAS"
            keytool -list -keystore "$KEYSTORE_TMP" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep 'Alias name:' || true
            exit 1
          fi
          echo "✅ Keystore validado"

          # `plugins/withReleaseSigning.js` copia estas variables a
          # android/gradle.properties durante el prebuild; el bloque Groovy que
          # inyecta también las lee de System.getenv como respaldo.
          # storeFile es relativo a android/app/, donde se instala el keystore.
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> $GITHUB_ENV
          echo "MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: 🛠️ Expo prebuild (generate android/)
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_PUBLIC_AMPLIFY_ENV: ${{ steps.auto-env.outputs.environment }}
          # Play sirve splits por ABI, así que el tamaño de descarga por dispositivo no cambia; solo el AAB crece.
          EXPO_ANDROID_ARCHITECTURES: armeabi-v7a,arm64-v8a,x86,x86_64
        run: |
          set -euo pipefail
          # android/ es gitignored y se regenera entero en cada build, por eso
          # la firma y el versionCode se inyectan vía config plugin / app.config.js
          # y no editando el build.gradle generado.
          npx expo prebuild --platform android --clean --no-install
          chmod +x android/gradlew

      - name: 🔑 Install keystore into android/app
        run: |
          set -euo pipefail
          # Después del prebuild: `--clean` borra android/ entero.
          cp "$RUNNER_TEMP/release.keystore" "$APP_DIR/android/app/release.keystore"
          echo "✅ Keystore en $APP_DIR/android/app/release.keystore"

      - name: 🔍 Verify generated Gradle configuration
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          set -euo pipefail
          echo "📋 Versión generada:"
          grep -nE 'versionCode|versionName' app/build.gradle

          if ! grep -q 'MYAPP_UPLOAD_STORE_FILE' app/build.gradle; then
            echo "❌ El plugin withReleaseSigning no inyectó signingConfigs.release"
            exit 1
          fi
          if ! grep -q '^MYAPP_UPLOAD_STORE_FILE=' gradle.properties; then
            echo "❌ gradle.properties sin las claves MYAPP_UPLOAD_*"
            exit 1
          fi
          if ! grep -q "versionCode $EXPO_ANDROID_VERSION_CODE" app/build.gradle; then
            echo "❌ versionCode no coincide con EXPO_ANDROID_VERSION_CODE"
            exit 1
          fi
          echo "✅ signingConfigs.release + versionCode $EXPO_ANDROID_VERSION_CODE aplicados"

      - name: 🔨 Build Android Bundle
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          set -euo pipefail
          # Reintentos: Maven Central / plugins.gradle.org devuelven 403/5xx de forma
          # intermitente a los runners de GitHub (visto en el run 34549591203).
          gradle_retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ $attempt -ge $max ]; then echo "❌ Gradle falló tras $max intentos"; return 1; fi
              echo "⚠️  Gradle falló (intento $attempt/$max); reintentando en $((attempt*45)) s..."
              sleep $((attempt*45)); attempt=$((attempt+1))
            done
          }
          gradle_retry ./gradlew bundleRelease --no-daemon

      - name: 🔍 Verify Bundle Signing
        run: |
          set -euo pipefail
          AAB="$APP_DIR/android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "❌ No se generó el bundle"
            ls -la "$APP_DIR/android/app/build/outputs/bundle/" || true
            exit 1
          fi
          echo "📦 Bundle: $(du -h "$AAB" | cut -f1)"

          SIGNATURE_FILES=$(unzip -l "$AAB" | grep -Ec 'META-INF.*\.(RSA|DSA|EC|SF|MF)' || true)
          if [ "$SIGNATURE_FILES" -gt 0 ]; then
            echo "✅ Bundle firmado ($SIGNATURE_FILES archivos de firma)"
          else
            echo "❌ El bundle NO está firmado — Google Play lo rechazará"
            exit 1
          fi

      - name: 📦 Upload AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
            ${{ env.APP_DIR }}/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: 📬 Send Bundle to Slack
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "📦 Nuevo Bundle AAB generado para UVA App (React Native)",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    { "title": "Versión", "value": "v${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})", "short": true },
                    { "title": "Rama", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                    { "title": "Autor", "value": "${{ github.actor }}", "short": true },
                    { "title": "Ambiente", "value": "${{ steps.auto-env.outputs.environment }}", "short": true },
                    { "title": "Bundle AAB", "value": "✅ Firmado, listo para Google Play", "short": true }
                  ],
                  "actions": [
                    { "type": "button", "text": "📥 Descargar Bundle", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" },
                    { "type": "button", "text": "📋 Ver Commit", "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 📬 Send Bundle Failure to Slack
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "❌ Error al generar Bundle AAB para UVA App (React Native)",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Versión", "value": "v${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})", "short": true },
                    { "title": "Rama", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                    { "title": "Autor", "value": "${{ github.actor }}", "short": true },
                    { "title": "Error", "value": "Falló la generación del Bundle AAB", "short": false }
                  ],
                  "actions": [
                    { "type": "button", "text": "🔍 Ver Logs", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 📊 Bundle Summary
        if: always()
        run: |
          {
            echo "## 📦 Bundle AAB Summary (React Native)"
            echo ""
            echo "- **App dir**: \`$APP_DIR\`"
            echo "- **Versión**: v${{ steps.version.outputs.version_name }} (code ${{ steps.version.outputs.version_code }})"
            echo "- **Fuente de la versión**: ${{ steps.version.outputs.source }}"
            echo "- **Rama/tag**: ${{ github.ref_name }}"
            echo "- **Ambiente Amplify**: ${{ steps.auto-env.outputs.environment }}"
            echo "- **Firma**: keystore de producción"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          AAB="$APP_DIR/android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB" ]; then
            echo "- ✅ **Production Bundle**: $(du -h "$AAB" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Error**: no se generó el bundle" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # 🚀 Subida automática a Google Play — PREPARADA PERO DESACTIVADA
  # ===========================================================================
  #
  # Este job no se ejecuta hasta que se cumplan LAS DOS condiciones:
  #
  #   1. Variable de repositorio `PLAY_DEPLOY_ENABLED` = 'true'
  #      Settings → Secrets and variables → Actions → pestaña **Variables**
  #      → New repository variable → PLAY_DEPLOY_ENABLED = true
  #
  #   2. Secret `PLAY_SERVICE_ACCOUNT_JSON` con el JSON completo de una cuenta
  #      de servicio de Google con permiso de release.
  #
  # 📋 Qué hay que crear en Google Play Console / Google Cloud (una sola vez):
  #
  #   a) Google Cloud Console → proyecto vinculado a la cuenta de desarrollador
  #      → IAM & Admin → Service Accounts → **Create service account**
  #      (ej. `uva-play-publisher`).
  #   b) En esa cuenta de servicio → Keys → **Add key → Create new key → JSON**.
  #      Se descarga un archivo .json: ese contenido COMPLETO es el valor del
  #      secret `PLAY_SERVICE_ACCOUNT_JSON`.
  #   c) Google Cloud Console → APIs & Services → habilitar la
  #      **Google Play Android Developer API** en ese proyecto.
  #   d) Google Play Console → Users and permissions → **Invite new user**
  #      → email de la cuenta de servicio → dar acceso a la app
  #      `com.makesens.appuva` con los permisos:
  #         • View app information and download bulk reports
  #         • Release to testing tracks (o "Release apps to production" si más
  #           adelante se quiere publicar directo a producción)
  #      → Invite user. Puede tardar unos minutos en propagarse.
  #   e) La PRIMERA versión de la ficha debe subirse a mano por la consola:
  #      la API no puede crear la ficha inicial de una app nueva.
  #
  # 🎯 Track: `internal` (testers internos) con `status: completed`, es decir,
  #    la release queda publicada en ese track sin pasos manuales. Para pasar a
  #    producción se promueve desde Play Console.
  #
  # 🔗 Enlace directo en Slack a la versión interna (variables de repositorio o
  #    secrets, opcionales; sin ellas el botón apunta a la portada de Play Console):
  #      PLAY_DEVELOPER_ID   → número largo tras `/developers/` en la URL de la consola
  #      PLAY_APP_ID         → número largo tras `/app/` en la URL de la app
  #      PLAY_INTERNAL_TEST_URL → enlace "Únete en la web" de Testing → Internal
  #                               testing → Testers (https://play.google.com/apps/internaltest/…)
  # ===========================================================================
  deploy-play:
    name: 🚀 Deploy to Google Play (internal)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.PLAY_DEPLOY_ENABLED == 'true' }}

    steps:
      - name: 🔍 Check Play service account secret
        id: check
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "❌ PLAY_DEPLOY_ENABLED=true pero falta el secret PLAY_SERVICE_ACCOUNT_JSON."
            echo "ℹ️  Ver las instrucciones en la cabecera del job deploy-play."
            exit 1
          fi
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✅ Secret PLAY_SERVICE_ACCOUNT_JSON presente"

      - name: 📥 Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: aab

      # `mappingFile` de la acción NO acepta globs (falló con ENOENT 'aab/**/mapping.txt'),
      # así que se resuelven las rutas reales antes de subir.
      - name: 📂 Locate AAB and mapping.txt
        id: files
        run: |
          set -euo pipefail
          AAB=$(find aab -type f -name 'app-release.aab' | head -n1)
          MAPPING=$(find aab -type f -name 'mapping.txt' | head -n1)
          if [ -z "$AAB" ]; then
            echo "❌ No se encontró app-release.aab en el artifact"; find aab -type f; exit 1
          fi
          if [ -z "$MAPPING" ]; then
            echo "❌ No se encontró mapping.txt en el artifact (R8 está activo; Play lo necesita para desofuscar crashes)"
            find aab -type f; exit 1
          fi
          echo "aab=$AAB" >> $GITHUB_OUTPUT
          echo "mapping=$MAPPING" >> $GITHUB_OUTPUT
          echo "✅ AAB: $AAB ($(du -h "$AAB" | cut -f1))"
          echo "✅ mapping.txt: $MAPPING ($(du -h "$MAPPING" | cut -f1))"

      # Los IDs pueden venir como variables (preferido: no son sensibles, están en
      # cualquier URL de la consola) o como secrets. Si son secrets, GitHub descarta
      # cualquier output que los contenga, así que la URL se arma en la expresión
      # del propio paso de Slack (env PLAY_DEV/PLAY_APP) y aquí solo se decide si hay IDs.
      - name: 🔗 Check Play Console link inputs
        id: links
        env:
          PLAY_DEVELOPER_ID: ${{ vars.PLAY_DEVELOPER_ID || secrets.PLAY_DEVELOPER_ID }}
          PLAY_APP_ID: ${{ vars.PLAY_APP_ID || secrets.PLAY_APP_ID }}
          PLAY_INTERNAL_TEST_URL: ${{ vars.PLAY_INTERNAL_TEST_URL }}
        run: |
          if [ -n "${PLAY_DEVELOPER_ID:-}" ] && [ -n "${PLAY_APP_ID:-}" ]; then
            echo "exact=true" >> $GITHUB_OUTPUT
            echo "✅ IDs de Play Console presentes: el Slack enlaza directo al track interno."
          else
            echo "exact=false" >> $GITHUB_OUTPUT
            echo "⚠️  Faltan PLAY_DEVELOPER_ID / PLAY_APP_ID (variables o secrets): el enlace de Slack irá a la portada de Play Console."
          fi
          echo "tester_url=${PLAY_INTERNAL_TEST_URL:-}" >> $GITHUB_OUTPUT

      - name: 🚀 Upload to Google Play (internal track)
        id: upload
        if: steps.check.outputs.available == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: ${{ steps.files.outputs.aab }}
          # mapping.txt de R8 (minify activo): Play lo usa para desofuscar crashes en Vitals.
          mappingFile: ${{ steps.files.outputs.mapping }}
          releaseName: ${{ needs.build.outputs.version_name }} (${{ needs.build.outputs.version_code }})
          track: internal
          status: completed

      - name: 📬 Send Play release to Slack
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚀 UVA App v${{ needs.build.outputs.version_name }} (${{ needs.build.outputs.version_code }}) publicada en Google Play — canal interno",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    { "title": "Versión", "value": "v${{ needs.build.outputs.version_name }} (${{ needs.build.outputs.version_code }})", "short": true },
                    { "title": "Track", "value": "internal (testers internos)", "short": true },
                    { "title": "Package", "value": "${{ env.ANDROID_PACKAGE_NAME }}", "short": true },
                    { "title": "Ambiente", "value": "${{ needs.build.outputs.environment }}", "short": true },
                    { "title": "Rama", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Autor", "value": "${{ github.actor }}", "short": true }
                  ],
                  "actions": [
                    { "type": "button", "style": "primary", "text": "📲 Probar esta versión (${{ needs.build.outputs.version_code }})", "url": "${{ steps.upload.outputs.internalSharingDownloadUrl || format('https://play.google.com/apps/test/{0}/{1}', env.ANDROID_PACKAGE_NAME, needs.build.outputs.version_code) }}" },
                    { "type": "button", "text": "🎯 Track interno en Play Console", "url": "${{ steps.links.outputs.exact == 'true' && format('https://play.google.com/console/u/0/developers/{0}/app/{1}/tracks/internal-testing', env.PLAY_DEV, env.PLAY_APP) || 'https://play.google.com/console/' }}" },
                    { "type": "button", "text": "📱 Unirse a la prueba interna", "url": "${{ steps.links.outputs.tester_url || (steps.links.outputs.exact == 'true' && format('https://play.google.com/console/u/0/developers/{0}/app/{1}/tracks/internal-testing/testers', env.PLAY_DEV, env.PLAY_APP)) || 'https://play.google.com/console/' }}" },
                    { "type": "button", "text": "📥 Bundle y logs", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PLAY_DEV: ${{ vars.PLAY_DEVELOPER_ID || secrets.PLAY_DEVELOPER_ID }}
          PLAY_APP: ${{ vars.PLAY_APP_ID || secrets.PLAY_APP_ID }}

      - name: 📬 Send Play deploy failure to Slack
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "❌ Falló la subida a Google Play de UVA App v${{ needs.build.outputs.version_name }} (${{ needs.build.outputs.version_code }})",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Versión", "value": "v${{ needs.build.outputs.version_name }} (${{ needs.build.outputs.version_code }})", "short": true },
                    { "title": "Track", "value": "internal", "short": true },
                    { "title": "Rama", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Autor", "value": "${{ github.actor }}", "short": true },
                    { "title": "Nota", "value": "El AAB firmado sí se generó: está en el artifact del run y puede subirse a mano.", "short": false }
                  ],
                  "actions": [
                    { "type": "button", "text": "🔍 Ver logs y descargar AAB", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" },
                    { "type": "button", "text": "🎯 Play Console", "url": "${{ steps.links.outputs.exact == 'true' && format('https://play.google.com/console/u/0/developers/{0}/app/{1}/tracks/internal-testing', env.PLAY_DEV, env.PLAY_APP) || 'https://play.google.com/console/' }}" }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PLAY_DEV: ${{ vars.PLAY_DEVELOPER_ID || secrets.PLAY_DEVELOPER_ID }}
          PLAY_APP: ${{ vars.PLAY_APP_ID || secrets.PLAY_APP_ID }}

      - name: 📊 Deploy summary
        if: always()
        run: |
          {
            echo "## 🚀 Google Play deploy"
            echo ""
            echo "- **Package**: \`$ANDROID_PACKAGE_NAME\`"
            echo "- **Track**: internal"
            echo "- **Versión**: v${{ needs.build.outputs.version_name }} (code ${{ needs.build.outputs.version_code }})"
            echo "- **Probar esta versión**: ${{ steps.upload.outputs.internalSharingDownloadUrl || format('https://play.google.com/apps/test/{0}/{1}', env.ANDROID_PACKAGE_NAME, needs.build.outputs.version_code) }}"
            if [ "${{ steps.links.outputs.exact }}" = "true" ]; then
              echo "- **Play Console**: enlace directo al track interno enviado a Slack"
            else
              echo "- ⚠️ Define \`PLAY_DEVELOPER_ID\` y \`PLAY_APP_ID\` (variables o secrets) para que el enlace de Slack apunte directo al track interno."
            fi
          } >> $GITHUB_STEP_SUMMARY
