# Gate de calidad de la app React Native: typecheck + lint + tests.
# Debe estar en verde antes de mergear.
#
# 📁 APP_DIR parametriza el directorio de la app. En el cutover
# (mover `mobile/` a la raíz) hay que cambiar:
#   - env.APP_DIR: mobile → .
#   - los filtros `paths:` — GitHub no admite expresiones ahí, así que son
#     el único punto del workflow que no se puede parametrizar.
name: Mobile CI — Typecheck + Lint + Jest

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

env:
  APP_DIR: mobile

jobs:
  quality:
    name: Typecheck + Lint + Jest (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ env.APP_DIR }}
        run: npm run typecheck

      - name: Lint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

      - name: Run tests
        working-directory: ${{ env.APP_DIR }}
        run: npm run test:ci
